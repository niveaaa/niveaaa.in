<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ankita — Video</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <div class="video-wrapper" aria-label="Vimeo video">
        <div class="video-frame">
          <div style="padding:100% 0 0 0;position:relative;"><iframe src="https://player.vimeo.com/video/1199047340?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479&amp;autoplay=1&amp;loop=1&amp;controls=0&amp;muted=0" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin" style="position:absolute;top:0;left:0;width:100%;height:100%;" title="ankita_1"></iframe></div>
          <button class="video-click-target" type="button" aria-label="Play video with sound"></button>
        </div>
      </div>
    </main>

    <script src="https://player.vimeo.com/api/player.js"></script>
    <script>
      const iframe = document.querySelector('iframe');
      const player = new Vimeo.Player(iframe);

      const clickTarget = document.querySelector('.video-click-target');
      let soundActivated = false;

      const enableSound = () => Promise.allSettled([
        player.setMuted(false),
        player.setVolume(1)
      ]);

      clickTarget.addEventListener('click', () => {
        enableSound()
          .then(() => player.getPaused())
          .then(paused => {
            if (!soundActivated || paused) {
              soundActivated = true;
              clickTarget.classList.add('has-sound');
              return player.play();
            }

            return player.pause();
          })
          .catch(error => {
            console.error('Could not control Vimeo playback:', error);
          });
      });
    </script>
  </body>
</html>
