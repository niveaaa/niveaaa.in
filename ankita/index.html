<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ankita — Video</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <div class="video-wrapper" aria-label="Vimeo video">
        <div class="video-frame">
          <div style="padding:100% 0 0 0;position:relative;"><iframe src="https://player.vimeo.com/video/1199047340?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479&amp;autoplay=1&amp;loop=1&amp;controls=0" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin" style="position:absolute;top:0;left:0;width:100%;height:100%;" title="ankita_1"></iframe></div>
          <button class="video-click-target" type="button" aria-label="Pause or play video"></button>
        </div>
      </div>
    </main>

    <script src="https://player.vimeo.com/api/player.js"></script>
    <script>
      const iframe = document.querySelector('iframe');
      const player = new Vimeo.Player(iframe);

      const clickTarget = document.querySelector('.video-click-target');

      clickTarget.addEventListener('click', () => {
        player.getPaused().then(paused => {
          if (paused) {
            player.play();
          } else {
            player.pause();
          }
        });
      });
    </script>
  </body>
</html>
