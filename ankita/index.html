<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ankita — Video</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <div class="video-wrapper" aria-label="Vimeo video">
        <div class="video-frame">
          <div style="position:relative;aspect-ratio:1/1;">
            <iframe
              loading="lazy"
              title="Gumlet video player"
              src="https://play.gumlet.io/embed/6a245e0cbc82cd6f1aa61193?background=false&amp;autoplay=false&amp;loop=true&amp;disable_player_controls=true"
              style="border:none; position: absolute; top: 0; left: 0; height: 100%; width: 100%;"
              referrerpolicy="origin"
              allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture; fullscreen;clipboard-write;">
            </iframe>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
