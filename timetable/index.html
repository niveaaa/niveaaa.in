  <script>
    // ── State ──
    let scheduleData = {};
    let currentDay = '';
    let currentFilter = 'all';
    const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
    const DAY_ABBR = ['MON', 'TUE', 'WED', 'THU', 'FRI'];
    const ALL_DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

    function getActualDayName() {
      return ALL_DAYS[new Date().getDay()];
    }

    function getMondayOfWeek(d = new Date()) {
      const day = d.getDay(); // 0=Sun, 1=Mon ... 6=Sat
      const monday = new Date(d);
      if (day === 0) {
        // Sunday: school week starts tomorrow (+1 day)
        monday.setDate(d.getDate() + 1);
      } else if (day === 6) {
        // Saturday: school week starts in 2 days (+2 days)
        monday.setDate(d.getDate() + 2);
      } else {
        // Mon-Fri: Monday of current school week
        monday.setDate(d.getDate() - (day - 1));
      }
      monday.setHours(0, 0, 0, 0);
      return monday;
    }

    // ── Bootstrap ──
    async function init() {
      updateClock();
      setInterval(updateClock, 1000);

      // Initialize dark mode from localStorage
      initDarkMode();

      try {
        const resp = await fetch('schedule.json?' + Date.now());
        scheduleData = await resp.json();
      } catch (e) {
        console.error('Failed to load schedule.json', e);
        document.getElementById('empty-state').classList.remove('hidden');
        return;
      }

      // Determine today
      const todayIndex = new Date().getDay(); // 0=Sun … 6=Sat
      if (todayIndex >= 1 && todayIndex <= 5) {
        currentDay = DAYS[todayIndex - 1];
      } else {
        currentDay = 'Monday'; // default to Monday on weekends
      }

      renderDayTabs();
      renderDay(currentDay, true);

      // Check every 5s, but only re-render if the minute actually changes, silently without animation
      let lastMinute = nowMinutes();
      setInterval(() => {
        const currentMin = nowMinutes();
        if (currentMin !== lastMinute) {
          lastMinute = currentMin;
          renderDay(currentDay, false);
        }
      }, 5000);

      // Auto-scroll to active card if one exists
      setTimeout(() => {
        const activeElem = document.querySelector('.timeline-active');
        if (activeElem) {
          activeElem.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }, 300);
    }

    // ── Clock ──
    function updateClock() {
      const now = new Date();
      const dayAbbr = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][now.getDay()];
      const h = now.getHours();
      const m = String(now.getMinutes()).padStart(2, '0');
      const ampm = h >= 12 ? 'PM' : 'AM';
      const hh = h % 12 || 12;
      document.getElementById('live-clock').textContent = `${dayAbbr} • ${String(hh).padStart(2, '0')}:${m} ${ampm}`;
    }

    // ── Dark Mode ──
    function initDarkMode() {
      const saved = localStorage.getItem('f18-dark-mode');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = saved === 'true' || (saved === null && prefersDark);
      applyDarkMode(isDark);
    }

    function toggleDarkMode() {
      const isDark = document.documentElement.classList.contains('dark');
      applyDarkMode(!isDark);
      localStorage.setItem('f18-dark-mode', !isDark);
    }

    function applyDarkMode(isDark) {
      const icon = document.getElementById('theme-icon');
      if (isDark) {
        document.documentElement.classList.add('dark');
        if (icon) icon.textContent = 'light_mode';
      } else {
        document.documentElement.classList.remove('dark');
        if (icon) icon.textContent = 'dark_mode';
      }
    }

    // ── Day Tabs ──
    function renderDayTabs() {
      const container = document.getElementById('day-tabs');
      const monday = getMondayOfWeek(new Date());
      const actualToday = getActualDayName();

      container.innerHTML = DAYS.map((day, i) => {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        const dateNum = d.getDate();
        const isSelected = day === currentDay;
        const isActuallyToday = day === actualToday;
        const activeClass = isSelected
          ? 'bg-primary text-on-primary shadow-sm'
          : 'text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high';
        return `
          <button onclick="switchDay('${day}')"
            class="flex-1 flex flex-col items-center justify-center py-1 rounded transition-all relative ${activeClass}">
            <span class="font-mono text-label-sm leading-none flex items-center justify-center gap-1">
              ${DAY_ABBR[i]}
              ${isActuallyToday ? `<span class="w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-on-primary' : 'bg-primary'} inline-block"></span>` : ''}
            </span>
            <span class="font-mono text-label-md leading-none mt-0.5 ${isSelected ? 'font-bold' : ''}">${dateNum}</span>
          </button>
        `;
      }).join('');
    }

    function switchDay(day) {
      currentDay = day;
      renderDayTabs();
      renderDay(day, true);
    }

    // ── Filter (disabled — no filter UI) ──
    function setFilter(filter) { currentFilter = 'all'; renderDay(currentDay); }

    // ── Time Helpers ──
    function parseTime(timeStr) {
      if (!timeStr) return 0;
      const cleaned = timeStr.trim().toLowerCase();
      const isPM = cleaned.includes('pm');
      const isAM = cleaned.includes('am');
      const numPart = cleaned.replace(/[apm\s]/g, '');
      const parts = numPart.split(':');
      let h = parseInt(parts[0], 10) || 0;
      let m = parseInt(parts[1], 10) || 0;

      if (isPM && h < 12) {
        h += 12;
      } else if (isAM && h === 12) {
        h = 0;
      } else if (!isPM && !isAM) {
        // College hours heuristic: hours 1 to 7 are afternoon PM (13:00 to 19:00)
        if (h >= 1 && h <= 7) {
          h += 12;
        }
      }
      return h * 60 + m;
    }

    function parseTimeRange(rangeStr) {
      if (!rangeStr) return { start: 0, end: 0 };
      const parts = rangeStr.split(/[–—-]/).map(s => s.trim());
      if (parts.length < 2) return { start: 0, end: 0 };
      let start = parseTime(parts[0]);
      let end = parseTime(parts[1]);
      if (end <= start && end < 12 * 60) {
        end += 12 * 60;
      }
      return { start, end };
    }

    function formatTime12(minutes) {
      const h = Math.floor(minutes / 60);
      const m = minutes % 60;
      const ampm = h >= 12 ? 'PM' : 'AM';
      const hh = h % 12 || 12;
      return `${String(hh).padStart(2, '0')}:${String(m).padStart(2, '0')} ${ampm}`;
    }

    function nowMinutes() {
      const n = new Date();
      return n.getHours() * 60 + n.getMinutes();
    }

    // ── Render Day ──
    function renderDay(day, withAnimation = false) {
      const container = document.getElementById('timeline-container');
      const heroCard  = document.getElementById('hero-card');
      const emptyState = document.getElementById('empty-state');
      const dateBadge = document.getElementById('current-date-badge');

      // Date badge
      const monday = getMondayOfWeek(new Date());
      const dayIndex = DAYS.indexOf(day);
      const targetDate = new Date(monday);
      targetDate.setDate(monday.getDate() + dayIndex);

      const actualDay = getActualDayName();
      const actualDayIndex = new Date().getDay(); // 0=Sun, 6=Sat
      const formattedDate = targetDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

      if (day === actualDay) {
        dateBadge.textContent = `${day}, ${formattedDate} • Today`;
      } else if (actualDayIndex === 0 && day === 'Monday') {
        dateBadge.textContent = `${day}, ${formattedDate} • Tomorrow`;
      } else if (actualDayIndex === 6 && day === 'Monday') {
        dateBadge.textContent = `${day}, ${formattedDate} • Upcoming Mon`;
      } else {
        dateBadge.textContent = `${day}, ${formattedDate}`;
      }

      const entries = (scheduleData.schedule && scheduleData.schedule[day]) || [];

      // Apply filter
      let filtered = entries;
      if (currentFilter !== 'all') {
        filtered = entries.filter(e => e.type === currentFilter);
      }

      if (filtered.length === 0) {
        container.innerHTML = '<div class="absolute left-[19px] top-2 bottom-4 w-[2px] bg-outline-variant/50"></div>';
        heroCard.classList.add('hidden');
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      const now = nowMinutes();
      const actualTodayName = getActualDayName();
      const isToday = (day === actualTodayName);

      // Find current & next class for hero card
      let currentClass = null;
      let nextClass = null;
      if (isToday) {
        for (const entry of entries) {
          if (entry.type === 'break') continue;
          const { start, end } = parseTimeRange(entry.time);
          if (now >= start && now < end) {
            currentClass = entry;
          }
          if (now < start && !nextClass) {
            nextClass = entry;
          }
        }
      }

      // Render hero
      if (currentClass) {
        renderHero(currentClass, 'now');
        heroCard.classList.remove('hidden');
      } else if (nextClass && isToday) {
        renderHero(nextClass, 'next');
        heroCard.classList.remove('hidden');
      } else {
        heroCard.classList.add('hidden');
      }

      // Build timeline HTML
      let html = '<div class="absolute left-[19px] top-2 bottom-4 w-[2px] bg-outline-variant/50"></div>';
      let nowTickerInserted = false;

      filtered.forEach((entry, idx) => {
        const { start, end } = parseTimeRange(entry.time);
        const isPast = isToday && now >= end;
        const isActive = isToday && now >= start && now < end;
        const isFuture = !isToday || now < start;

        // Insert NOW ticker before this card if applicable
        if (isToday && !nowTickerInserted && now < start) {
          html += renderNowTicker();
          nowTickerInserted = true;
        }
        // Insert NOW ticker after active class
        if (isToday && isActive && !nowTickerInserted) {
          // We'll insert it after this card
        }

        if (entry.type === 'break') {
          html += renderBreakCard(entry, isPast, isActive, idx, withAnimation);
        } else {
          html += renderClassCard(entry, isPast, isActive, isFuture, idx, withAnimation);
        }

        // Insert NOW ticker after active card
        if (isToday && isActive && !nowTickerInserted) {
          html += renderNowTicker();
          nowTickerInserted = true;
        }
      });

      // If now is after all classes and ticker not inserted
      if (isToday && !nowTickerInserted && entries.length > 0) {
        const lastEntry = entries[entries.length - 1];
        const { end } = parseTimeRange(lastEntry.time);
        if (now >= end) {
          // Day is over, no ticker needed
        }
      }

      container.innerHTML = html;
    }

    // ── Hero Card ──
    function renderHero(entry, mode) {
      const heroContent = document.getElementById('hero-content');
      const { start, end } = parseTimeRange(entry.time);
      const now = nowMinutes();

      if (mode === 'now') {
        const elapsed = now - start;
        const total = end - start;
        const remaining = end - now;
        const pct = Math.min(100, Math.round((elapsed / total) * 100));

        heroContent.innerHTML = `
          <div class="flex items-center justify-between gap-space-sm mb-space-xs">
            <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-tertiary-fixed text-on-tertiary-fixed">
              <span class="relative flex h-2 w-2">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-tertiary opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-tertiary"></span>
              </span>
              <span class="font-mono text-label-sm font-semibold tracking-wider uppercase">Happening Now</span>
            </div>
            <span class="font-mono text-label-md font-semibold text-tertiary flex items-center gap-1">
              <span class="material-symbols-outlined text-[16px]">timelapse</span>
              ${remaining} mins left
            </span>
          </div>
          <h2 class="font-jakarta text-headline-md font-bold text-on-surface tracking-tight mt-1">${entry.subject}</h2>
          <div class="flex items-center gap-2 mt-0.5">
            <span class="font-jakarta text-body-sm text-on-surface-variant">${entry.type === 'lab' ? 'Lab' : entry.type === 'tutorial' ? 'Tutorial' : 'Lecture'}</span>
          </div>
          <div class="w-full mt-3 mb-2">
            <div class="flex justify-between items-center text-on-surface-variant font-mono text-label-sm mb-1">
              <span>${formatTime12(start)}</span>
              <span class="font-medium text-tertiary">${formatTime12(now)} (Active)</span>
              <span>${formatTime12(end)}</span>
            </div>
            <div class="w-full h-2 bg-surface-container rounded-full overflow-hidden p-0.5">
              <div class="h-full bg-tertiary-container rounded-full transition-all duration-700" style="width:${pct}%"></div>
            </div>
          </div>
          <div class="flex items-center gap-2 mt-2 p-2.5 rounded-lg bg-surface-container-low">
            <div class="w-8 h-8 rounded-lg bg-primary-container text-on-primary-container flex items-center justify-center shrink-0 shadow-sm">
              <span class="material-symbols-outlined text-[18px]">domain</span>
            </div>
            <span class="font-jakarta text-label-lg font-bold text-on-surface">${entry.room}</span>
          </div>
        `;
      } else {
        // Next class
        const minsUntil = start - now;
        heroContent.innerHTML = `
          <div class="flex items-center justify-between gap-space-sm mb-space-xs">
            <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-primary-fixed text-on-primary-fixed">
              <span class="material-symbols-outlined text-[14px]">arrow_forward</span>
              <span class="font-mono text-label-sm font-semibold tracking-wider uppercase">Up Next</span>
            </div>
            <span class="font-mono text-label-md font-semibold text-primary flex items-center gap-1">
              <span class="material-symbols-outlined text-[16px]">timer</span>
              In ${minsUntil} mins
            </span>
          </div>
          <h2 class="font-jakarta text-headline-md font-bold text-on-surface tracking-tight mt-1">${entry.subject}</h2>
          <div class="flex items-center gap-2 mt-0.5">
            <span class="font-jakarta text-body-sm text-on-surface-variant">${formatTime12(start)} – ${formatTime12(end)}</span>
          </div>
          <div class="flex items-center gap-2 mt-3 p-2.5 rounded-lg bg-surface-container-low">
            <div class="w-8 h-8 rounded-lg bg-primary-container text-on-primary-container flex items-center justify-center shrink-0 shadow-sm">
              <span class="material-symbols-outlined text-[18px]">domain</span>
            </div>
            <span class="font-jakarta text-label-lg font-bold text-on-surface">${entry.room}</span>
          </div>
        `;
      }
    }

    // ── NOW Ticker ──
    function renderNowTicker() {
      const now = nowMinutes();
      return `
        <div class="relative w-full my-5 -ml-12 pl-12 pointer-events-none">
          <div class="relative flex items-center">
            <div class="absolute left-[13px] w-3.5 h-3.5 rounded-full bg-error flex items-center justify-center now-glow">
              <span class="w-1.5 h-1.5 rounded-full bg-on-error"></span>
            </div>
            <div class="w-full flex items-center">
              <div class="h-[2px] w-full bg-error shadow-sm"></div>
              <div class="shrink-0 px-2 py-0.5 rounded-full bg-error text-on-error font-mono text-label-sm font-bold shadow-md ml-1 tracking-tight flex items-center gap-1">
                <span class="material-symbols-outlined text-[13px]">schedule</span>
                NOW ${formatTime12(now)}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // ── Class Card ──
    // Fixed icons per type
    const TYPE_ICON = { lecture: 'auto_stories', tutorial: 'group', lab: 'science' };

    function typeLabel(type) {
      if (type === 'lab') return 'Lab';
      if (type === 'tutorial') return 'Tutorial';
      return 'Lecture';
    }

    function renderClassCard(entry, isPast, isActive, isFuture, idx, withAnimation = false) {
      const { start, end } = parseTimeRange(entry.time);
      const icon = TYPE_ICON[entry.type] || 'auto_stories';
      const now = nowMinutes();

      // Node styling
      let nodeHtml;
      if (isPast) {
        nodeHtml = `
          <div class="absolute -left-12 top-4 w-[16px] h-[16px] rounded-full bg-outline-variant flex items-center justify-center shadow-sm">
            <span class="material-symbols-outlined text-[11px] text-surface-container-lowest font-bold">check</span>
          </div>`;
      } else if (isActive) {
        nodeHtml = `
          <div class="absolute -left-12 top-4 w-[22px] h-[22px] rounded-full bg-tertiary-fixed border-2 border-tertiary flex items-center justify-center shadow-lg z-10">
            <span class="w-4 h-4 rounded-full bg-tertiary animate-ping absolute opacity-75"></span>
            <span class="w-2.5 h-2.5 rounded-full bg-tertiary relative"></span>
          </div>`;
      } else {
        const dotColor = entry.type === 'lab' ? 'bg-lab-accent' : entry.type === 'tutorial' ? 'bg-on-tertiary-container' : 'bg-primary';
        const ringColor = entry.type === 'lab' ? 'bg-lab-accent-light' : entry.type === 'tutorial' ? 'bg-tertiary-fixed' : 'bg-primary-fixed';
        nodeHtml = `
          <div class="absolute -left-12 top-4 w-[16px] h-[16px] rounded-full ${ringColor} flex items-center justify-center">
            <span class="w-2 h-2 rounded-full ${dotColor}"></span>
          </div>`;
      }

      // Accent color per type
      const accentColor = entry.type === 'lab' ? 'bg-lab-accent' : entry.type === 'tutorial' ? 'bg-on-tertiary-container' : 'bg-primary';
      const codeColor = entry.type === 'lab' ? 'text-lab-accent' : entry.type === 'tutorial' ? 'text-on-tertiary-container' : 'text-primary';

      // Card appearance
      let cardBg, cardShadow, accentBar, textMute;
      if (isPast) {
        cardBg = 'bg-surface-container-low';
        cardShadow = '';
        accentBar = '';
        textMute = 'text-on-surface-variant';
      } else if (isActive) {
        cardBg = 'bg-surface-container-lowest active-card-glow ring-2 ring-tertiary';
        cardShadow = 'shadow-xl';
        accentBar = `<div class="absolute left-0 top-0 bottom-0 w-2 bg-tertiary shadow-[0_0_12px_rgba(16,185,129,0.7)]"></div>`;
        textMute = 'text-on-surface';
      } else {
        cardBg = 'bg-surface-container-lowest';
        cardShadow = 'shadow-sm';
        accentBar = `<div class="absolute left-0 top-0 bottom-0 w-1.5 ${accentColor}"></div>`;
        textMute = 'text-on-surface';
      }

      // Badge styling per type
      let typeBadgeCls;
      if (entry.type === 'lab') {
        typeBadgeCls = 'bg-lab-accent-light text-lab-on-accent';
      } else if (entry.type === 'tutorial') {
        typeBadgeCls = 'bg-tertiary-fixed text-on-tertiary-fixed';
      } else {
        typeBadgeCls = 'bg-surface-container-high text-primary';
      }

      // Status badge
      let statusBadge = '';
      if (isPast) {
        statusBadge = `
          <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-surface-container text-on-surface-variant font-mono text-label-sm">
            <span class="material-symbols-outlined text-[13px] text-tertiary">check_circle</span>
            Done
          </span>`;
      } else if (isActive) {
        statusBadge = `
          <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-tertiary text-on-tertiary font-mono text-label-sm font-bold shadow-md animate-pulse tracking-wide">
            <span class="relative flex h-2 w-2">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-on-tertiary opacity-80"></span>
              <span class="relative inline-flex rounded-full h-2 w-2 bg-on-tertiary"></span>
            </span>
            HAPPENING NOW
          </span>`;
      }

      // Time label color
      const timeColor = isActive ? 'text-tertiary font-bold' : isPast ? 'text-on-surface-variant' : 'text-on-surface font-semibold';

      // Realtime ongoing progress bar
      let progressHtml = '';
      if (isActive) {
        const elapsed = Math.max(0, now - start);
        const total = Math.max(1, end - start);
        const remaining = Math.max(0, end - now);
        const progressPct = Math.min(100, Math.max(0, Math.round((elapsed / total) * 100)));
        progressHtml = `
          <div class="mt-3 p-2.5 rounded-xl bg-surface-container-low border border-tertiary/20">
            <div class="flex items-center justify-between font-mono text-label-sm mb-1.5">
              <span class="text-tertiary font-bold flex items-center gap-1">
                <span class="material-symbols-outlined text-[15px]">timelapse</span>
                ${remaining}m remaining
              </span>
              <span class="font-bold text-tertiary">${progressPct}%</span>
            </div>
            <div class="w-full h-2 bg-surface-container rounded-full overflow-hidden p-0.5">
              <div class="h-full bg-tertiary rounded-full transition-all duration-700 shadow-sm" style="width: ${progressPct}%"></div>
            </div>
          </div>
        `;
      }

      return `
        <div class="timeline-item ${isActive ? 'timeline-active' : ''} ${withAnimation ? 'animate-slide-up' : ''} relative mb-6" data-type="${entry.type}">
          ${nodeHtml}
          <div class="flex items-center justify-between mb-1.5">
            <span class="font-mono text-label-md ${timeColor}">${formatTime12(start)} – ${formatTime12(end)}</span>
            ${statusBadge}
          </div>
          <div class="relative p-space-md rounded-2xl ${cardBg} ${cardShadow} overflow-hidden card-hover">
            ${accentBar}
            <div class="flex items-start justify-between gap-2 ${accentBar ? 'pl-1' : ''}">
              <div class="flex-1">
                <span class="inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded ${typeBadgeCls} font-mono text-label-sm font-medium">${typeLabel(entry.type)}</span>
                <h3 class="font-jakarta text-headline-md font-bold ${textMute} mt-1.5 line-clamp-2">${entry.subject}</h3>
              </div>
              <div class="w-9 h-9 rounded-lg bg-surface-container flex items-center justify-center shrink-0 ${isActive ? 'bg-tertiary text-on-tertiary' : isPast ? 'text-outline' : codeColor}">
                <span class="material-symbols-outlined text-[20px]">${icon}</span>
              </div>
            </div>
            ${progressHtml}
            <div class="flex items-center justify-between gap-2.5 mt-3 pt-2.5 border-t border-outline-variant/30 ${isPast ? 'text-on-surface-variant' : 'text-on-surface'}">
              <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-[18px] ${isActive ? 'text-tertiary' : isPast ? 'text-outline' : codeColor}">meeting_room</span>
                <span class="font-mono text-label-lg font-bold">${entry.room}</span>
              </div>
              ${isActive ? '<span class="font-mono text-label-sm px-2 py-0.5 rounded-md bg-tertiary-fixed text-on-tertiary-fixed font-bold tracking-tight">Active Now</span>' : ''}
            </div>
          </div>
        </div>
      `;
    }

    // ── Break Card ──
    function renderBreakCard(entry, isPast, isActive, idx, withAnimation = false) {
      const { start, end } = parseTimeRange(entry.time);
      const now = nowMinutes();
      const nodeOpacity = isPast ? 'bg-outline-variant' : isActive ? 'bg-tertiary-fixed border-2 border-tertiary' : 'bg-surface-container-high';
      const remaining = Math.max(0, end - now);

      let nodeContent = `<span class="w-1.5 h-1.5 rounded-full ${isPast ? 'bg-outline-variant' : 'bg-outline'}"></span>`;
      if (isActive) {
        nodeContent = `
          <span class="w-3.5 h-3.5 rounded-full bg-tertiary animate-ping absolute opacity-70"></span>
          <span class="w-2 h-2 rounded-full bg-tertiary relative"></span>
        `;
      }

      return `
        <div class="timeline-item ${isActive ? 'timeline-active' : ''} ${withAnimation ? 'animate-slide-up' : ''} relative mb-6" data-type="break">
          <div class="absolute -left-12 top-3 w-[16px] h-[16px] rounded-full ${nodeOpacity} flex items-center justify-center">
            ${nodeContent}
          </div>
          <div class="flex items-center justify-between mb-1.5">
            <span class="font-mono text-label-md ${isActive ? 'text-tertiary font-bold' : isPast ? 'text-on-surface-variant' : 'text-on-surface-variant font-semibold'}">${formatTime12(start)} – ${formatTime12(end)}</span>
            ${isActive ? `
              <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-tertiary text-on-tertiary font-mono text-label-sm font-bold shadow-sm animate-pulse">
                BREAK ACTIVE (${remaining}m left)
              </span>
            ` : ''}
          </div>
          <div class="p-3 rounded-xl ${isActive ? 'bg-surface-container active-card-glow ring-2 ring-tertiary' : 'bg-surface-container'} flex items-center gap-3 ${isPast ? 'opacity-60' : ''}">
            <div class="w-8 h-8 rounded-lg bg-surface-container-highest text-on-surface-variant flex items-center justify-center shrink-0 ${isActive ? 'text-tertiary' : ''}">
              <span class="material-symbols-outlined text-[18px]">${entry.icon || 'coffee'}</span>
            </div>
            <div class="flex-1">
              <h4 class="font-jakarta text-label-lg font-bold text-on-surface">${entry.subject || 'Break'}</h4>
              <p class="font-jakarta text-body-sm text-on-surface-variant">${entry.room ? entry.room + ' • ' : ''}${formatTime12(start)} – ${formatTime12(end)}</p>
            </div>
          </div>
        </div>
      `;
    }

    // ── Swipe to switch days ──
    (function() {
      let startX = 0, startY = 0;
      const main = document.querySelector('main');

      main.addEventListener('touchstart', e => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, { passive: true });

      main.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;
        // Only trigger if horizontal swipe is dominant and exceeds threshold
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
          const idx = DAYS.indexOf(currentDay);
          if (dx < 0 && idx < DAYS.length - 1) {
            // Swipe left → next day
            switchDay(DAYS[idx + 1]);
          } else if (dx > 0 && idx > 0) {
            // Swipe right → previous day
            switchDay(DAYS[idx - 1]);
          }
        }
      }, { passive: true });
    })();

    // ── Register Service Worker (strictly scoped to /timetable/) ──
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then((reg) => {
            console.log('Timetable PWA service worker registered with scope:', reg.scope);
          })
          .catch((err) => {
            console.warn('Timetable PWA service worker registration failed:', err);
          });
      });
    }

    // ── Kick off ──
    document.addEventListener('DOMContentLoaded', init);
  </script>
